plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
configurations {
    shadowImplementation
    implementation.extendsFrom shadowImplementation
}
repositories {
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
}
dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    shadowImplementation "me.zeroeightsix:fiber:0.23.0-2"
    include "me.zeroeightsix:fiber:0.23.0-2"
}
loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
// Fix lỗi Javadoc cho Fabric module do thiếu classpath của Minecraft
tasks.withType(Javadoc).configureEach {
    // QUAN TRỌNG: Gán classpath của sourceSet main để Javadoc thấy được Minecraft & Fabric API
    classpath = sourceSets.main.compileClasspath
    
    // Bỏ qua lỗi cú pháp thẻ HTML trong comment (thường gặp khi dùng JDK 17+)
    failOnError = false
    
    // Tránh lỗi encoding
    options.encoding = 'UTF-8'
    
    // Tắt chế độ kiểm tra doclint nghiêm ngặt (nếu bạn dùng JDK 17+)
    options.addStringOption('Xdoclint:none', '-quiet')
}