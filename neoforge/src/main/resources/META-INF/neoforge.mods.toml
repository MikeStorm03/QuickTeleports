modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}" 
license = "${license}"
issueTrackerURL="https://github.com/MikeStorm03/QuickTeleports/issues"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL=https://github.com/MikeStorm03/QuickTeleports"
logoFile="${mod_id}.png"
credits="${credits}"
authors = "${mod_author}"
description = '''${description}'''
[[mixins]]
config = "remove-dialog-warning.mixins.json"
[[dependencies.${mod_id}]]
modId = "neoforge"
type="required
versionRange = "[${neoforge_version},)" 
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type="required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features.${mod_id}]
#openGLVersion="[3.2,)"
